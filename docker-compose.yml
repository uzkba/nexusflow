services:
  db:
    image: postgres:16
    container_name: nexusflow-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - nexusflow_pgdata:/var/lib/postgresql/data
      # Mount the backup folder here as well so we can easily run pg_restore from inside this container
      - ./data/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-backup:
    image: postgres:16-alpine
    container_name: nexusflow-backup-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./scripts:/scripts:ro
      - ./data/backups:/backups
    entrypoint: ["sh", "/scripts/entrypoint-cron.sh"]

  backend:
    build:
      context: .                      # contexto na raiz
      dockerfile: backend/Dockerfile  # caminho do Dockerfile do back
    container_name: nexusflow-backend-dev
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app  
      - /var/run/docker.sock:/var/run/docker.sock

  # worker:
  #   build:
  #     context: ./worker
  #     dockerfile: Dockerfile
  #   container_name: nexusflow-worker-dev
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   depends_on:
  #     db:
  #       condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusflow-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_BYPASS_AUTH=${VITE_BYPASS_AUTH:-false}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  nexusflow_pgdata: