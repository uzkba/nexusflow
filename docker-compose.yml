services:
  db:
    image: postgres:16
    container_name: nexusflow-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - nexusflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
      build:
        context: .                      # antes: ./backend
        dockerfile: backend/Dockerfile  # antes: Dockerfile
      container_name: nexusflow-backend-dev
      restart: unless-stopped
      env_file:
        - .env
      depends_on:
        db:
          condition: service_healthy
      ports:
        - "127.0.0.1:8001:8000"
      volumes:
        - .:/app   

